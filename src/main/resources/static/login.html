
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JobPortal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            padding: 20px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #172554;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 1.8;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>Welcome Back!</h1>
        <p class="subtitle">Log in to continue your job search.</p>

        <form id="loginForm">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                required
                autocomplete="email"
                placeholder="Enter your email">

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                required
                autocomplete="current-password"
                placeholder="Enter your password">

            <button type="submit" id="loginButton">Login</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <div class="links">
            <p>Don't have an account? <a href="register.html">Register</a></p>
            <p><a href="/">Back to Home</a></p>
        </div>
    </main>

   
<script>
document.getElementById("loginForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    message.textContent = "Logging in...";

    try {
        const response = await fetch("/api/users/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || data.error || "Invalid email or password."
            );
        }

        if (!data.id || !data.role) {
            throw new Error("Login response is missing user details.");
        }

        const role = String(data.role).toUpperCase();

        const user = {
            id: data.id,
            name: data.name,
            email: data.email,
            role: role
        };

        if (role === "CANDIDATE") {
            sessionStorage.setItem("candidateUser", JSON.stringify(user));
            window.location.href = "candidate-dashboard.html";
        } else if (role === "RECRUITER") {
            sessionStorage.setItem("recruiterUser", JSON.stringify(user));
            window.location.href = "recruiter-dashboard.html";
        } else {
            throw new Error("Unknown user role.");
        }

    } catch (error) {
        message.textContent = error.message || "Unable to log in.";
    }
});
</script>

</body>
</html>
